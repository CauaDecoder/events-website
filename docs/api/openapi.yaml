openapi: 3.1.0
info:
  title: Events SaaS API
  version: 1.0.0
paths:
  /api/v1/public/invitations/{slug}:
    get:
      summary: Retorna o último snapshot publicado de um convite
      operationId: getPublicInvitation
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Convite publicado
          headers:
            ETag:
              schema:
                type: string
        '404':
          description: Convite inexistente ou não publicado
